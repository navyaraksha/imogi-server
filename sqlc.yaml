version: '2'

sql:
  - engine: postgresql
    schema:
      - db/migrations/000001_employee_module.sql
      - db/migrations/000002_organization_multitenancy.sql
      - db/migrations/000003_identity_access.sql
      - db/migrations/000004_identity_provisioning.sql
      - db/migrations/000005_identity_sessions.sql
      - db/migrations/000006_payroll_ledger.sql
      - db/migrations/000007_file_batches_and_jobs.sql
    queries: db/queries
    gen:
      go:
        package: sqlc
        out: internal/infrastructure/postgres/sqlc
        sql_package: pgx/v5
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: platform.uuid_v7
            go_type:
              import: github.com/google/uuid
              type: UUID
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
          - db_type: platform.uuid_v7
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
