paths:
  /api/v1/platform/users:
    get:
      tags: [Platform Users]
      operationId: listPlatformUsers
      security:
        - OAuth2: [platform:user:read]
        - ImogiSession: []
      x-required-capabilities:
        all: [platform.user.read]
      summary: List platform users
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/Limit'
        - $ref: '../openapi.yaml#/components/parameters/Cursor'
        - name: search
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 320
        - name: status
          in: query
          schema:
            $ref: '../openapi.yaml#/components/schemas/PlatformUserStatus'
      responses:
        '200':
          description: Platform user page.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/PlatformUserListResponse'
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
    post:
      tags: [Platform Users]
      operationId: createPlatformUser
      security:
        - OAuth2: [platform:user:write]
        - ImogiSession: []
      x-required-capabilities:
        all: [platform.user.create]
      summary: Pre-register a platform user
      description: The user becomes active and links to Google on first verified login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/CreatePlatformUserRequest'
      responses:
        '201':
          description: Platform user pre-registered.
          headers:
            Location: { $ref: '../openapi.yaml#/components/headers/Location' }
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/PlatformUserDetail'
        '400': { $ref: '../openapi.yaml#/components/responses/InvalidRequest' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
        '409': { $ref: '../openapi.yaml#/components/responses/Conflict' }

  /api/v1/platform/users/{userId}:
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/PlatformUserId'
    get:
      tags: [Platform Users]
      operationId: getPlatformUser
      security:
        - OAuth2: [platform:user:read]
        - ImogiSession: []
      x-required-capabilities:
        all: [platform.user.read]
      summary: Get a platform user
      responses:
        '200':
          description: Platform user detail.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/PlatformUserDetail'
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }

  /api/v1/platform/users/{userId}/block:
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/PlatformUserId'
    post:
      tags: [Platform Users]
      operationId: blockPlatformUser
      security:
        - OAuth2: [platform:user:write]
        - ImogiSession: []
      x-required-capabilities:
        all: [platform.user.block]
      summary: Block a platform user
      responses:
        '200':
          description: Platform user blocked.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/PlatformUserDetail'
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../openapi.yaml#/components/responses/NotFound' }
        '409': { $ref: '../openapi.yaml#/components/responses/Conflict' }

  /api/v1/platform/tenants/{tenantId}/memberships:
    parameters:
      - $ref: '../openapi.yaml#/components/parameters/TenantId'
    get:
      tags: [Tenant Memberships]
      operationId: listPlatformTenantMemberships
      security:
        - OAuth2: [platform:membership:read]
        - ImogiSession: []
      x-required-capabilities:
        all: [platform.membership.read]
      summary: List memberships for a tenant
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/Limit'
        - $ref: '../openapi.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Tenant membership page.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/TenantMembershipListResponse'
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
    post:
      tags: [Tenant Memberships]
      operationId: createPlatformTenantMembership
      security:
        - OAuth2: [platform:membership:write]
        - ImogiSession: []
      x-required-capabilities:
        all: [platform.membership.write]
      summary: Provision a tenant membership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/CreateTenantMembershipRequest'
      responses:
