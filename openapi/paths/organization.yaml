paths:
  /api/v1/platform/tenants:
    get:
      tags: [Platform Tenants]
      operationId: listPlatformTenants
      security:
        - OAuth2: [platform:tenant:read]
        - ImogiSession: []
      x-required-capabilities:
        all: [platform.tenant.read]
      summary: List tenants
      description: Platform administration endpoint. It is not available to tenant-scoped administrators.
      parameters:
        - $ref: '../openapi.yaml#/components/parameters/Limit'
        - $ref: '../openapi.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Tenant page.
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/TenantListResponse'
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
    post:
      tags: [Platform Tenants]
      operationId: createPlatformTenant
      security:
        - OAuth2: [platform:tenant:write]
        - ImogiSession: []
      x-required-capabilities:
        all: [platform.tenant.create]
      summary: Provision a tenant
      description: Creates a provisioned tenant. Initial membership provisioning is a separate IAM workflow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/CreateTenantRequest'
      responses:
        '201':
          description: Tenant provisioned.
          headers:
            Location: { $ref: '../openapi.yaml#/components/headers/Location' }
          content:
            application/json:
              schema:
                $ref: '../openapi.yaml#/components/schemas/TenantDetail'
        '400': { $ref: '../openapi.yaml#/components/responses/InvalidRequest' }
        '401': { $ref: '../openapi.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../openapi.yaml#/components/responses/Forbidden' }
        '409': { $ref: '../openapi.yaml#/components/responses/Conflict' }

  /api/v1/platform/tenants/{tenantId}:
