  Timestamp:
    type: string
    format: date-time
    description: RFC 3339 timestamp in UTC.

  Date:
    type: string
    format: date
    description: ISO 8601 calendar date without a time zone.

  NullableDate:
    type: [string, 'null']
    format: date

  Pagination:
    type: object
    required: [nextCursor]
    properties:
      nextCursor:
        type: [string, 'null']
        description: Cursor for the next page, or null when there is no next page.

  ErrorResponse:
    type: object
    required: [code, message, details]
    properties:
      code:
        type: string
        description: Stable machine-readable error code.
        examples: [EMPLOYMENT_ALREADY_ENDED]
      message:
        type: string
        description: Human-readable explanation safe for API consumers.
      details:
        type: object
        description: Structured, error-specific context.
        additionalProperties: true

